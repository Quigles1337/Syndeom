[package]
name = "syndeom-pair"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
description = "ADR-0007 reviewed Judson/Mathlib archival and canonical pair producer"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
syndeom-manifest = { path = "../manifest" }

[build-dependencies]
syndeom-manifest = { path = "../manifest" }
