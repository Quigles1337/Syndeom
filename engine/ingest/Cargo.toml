[package]
name = "syndeom-ingest"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "SYNDEOM s1_ingest 0.1.0: writes a ground-truth raw/1 manifest from a per-item config and the original's bytes; decides nothing (ADR-0003 D6)"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
syndeom-manifest = { path = "../manifest" }
