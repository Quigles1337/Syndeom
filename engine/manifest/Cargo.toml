[package]
name = "syndeom-manifest"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
description = "SYNDEOM proof-artifact manifest types, byte formats, hashes, and fidelity verdicts (ADR-0001)"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.1"
hex = "0.4.3"
